[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zomah"
version = "0.1.0"
description = "Zerrius's Orchestrated Minimal Agent Harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "textual>=8.2,<9",
]

[project.scripts]
zomah-console = "zomah.console.app:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
